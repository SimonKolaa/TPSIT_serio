<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Ricerca Prodotto</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 500px; margin: auto; }
        #risultato { margin-top: 20px; }
    </style>
    <script>
        function cercaProdotto(event) {
            if (event.preventDefault) {
                event.preventDefault();
            } else {
                event.returnValue = false;
            }

            // Preso da controllo.png
            var text = document.getElementById('codice_input').value;
            
            // Validazione con match ed espressione regolare
            if(!text.match(/^[a-zA-Z][0-9]{3}$/)) {
                alert("Codice non valido");
            } else {
                // AJAX
                var xhr = new XMLHttpRequest();
                
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        var divRisultato = document.getElementById('risultato');
                        
                        if (xhr.status === 200) {
                            // PARSING in JSON
                            var jsonDoc = JSON.parse(xhr.responseText);
                            
                            // Costruzione stringa HTML come da formato_risultato.png
                            var htmlList = "<ul>";
                            htmlList += "<li>";
                            htmlList += "<ul>";
                            htmlList += "<li>prezzo: " + jsonDoc.prezzo + "</li>";
                            htmlList += "<li>marca: " + jsonDoc.marca + "</li>";
                            htmlList += "<li>modello: " + jsonDoc.modello + "</li>";
                            htmlList += "</ul>";
                            htmlList += "</li>";
                            htmlList += "<li></li>";
                            htmlList += "<li></li>";
                            htmlList += "</ul>";

                            divRisultato.innerHTML = htmlList;
                        } else {
                            divRisultato.innerHTML = "<p style='color:red;'>Errore: Prodotto non trovato.</p>";
                        }
                    }
                };

                xhr.open("GET", "/api/prodotto?codice=" + text, true);
                xhr.send();
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <h2>Ricerca Catalogo Informatica</h2>
        
        <form onsubmit="cercaProdotto(event)">
            <label for="codice_input">Codice Prodotto:</label><br>
            <input type="text" id="codice_input" placeholder="Es. A123" style="padding: 5px; margin-top: 5px;">
            <button type="submit" style="padding: 5px 10px;">Cerca</button>
        </form>

        <div id="risultato"></div>
    </div>
</body>
</html>
