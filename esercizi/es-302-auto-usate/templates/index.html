<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concessionaria Auto Usate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .form-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .form-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .form-group input,
        .form-group select {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px 25px;
            font-size: 1em;
            font-weight: 600;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-reset {
            background: #6c757d;
            color: white;
        }

        .btn-reset:hover {
            background: #5a6268;
        }

        .results-section {
            margin-top: 30px;
            display: none;
        }

        .results-section.show {
            display: block;
        }

        .results-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .results-count {
            color: #666;
            margin-bottom: 15px;
            font-size: 0.95em;
        }

        .results-count strong {
            color: #667eea;
            font-weight: 700;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 0.95em;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        tbody tr {
            transition: background-color 0.2s ease;
        }

        tbody tr:hover {
            background-color: #f5f5f5;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.1em;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-weight: 600;
        }

        .loading.show {
            display: block;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            table {
                font-size: 0.9em;
            }

            th, td {
                padding: 10px;
            }
        }

        .image-placeholder {
            width: 60px;
            height: 60px;
            background: #e9ecef;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 0.8em;
            text-align: center;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1> Concessionaria Auto Usate</h1>
            <p>Trova il veicolo perfetto per te</p>
        </header>

        <div class="content">
            <div class="form-section">
                <h2>Cerca un'auto</h2>
                <form id="searchForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="marca">Marca</label>
                            <input type="text" id="marca" name="marca" placeholder="es. Fiat, Ford, Audi...">
                        </div>
                        <div class="form-group">
                            <label for="modello">Modello</label>
                            <input type="text" id="modello" name="modello" placeholder="es. 500, Fiesta, A1...">
                        </div>
                        <div class="form-group">
                            <label for="alimentazione">Alimentazione</label>
                            <select id="alimentazione" name="alimentazione">
                                <option value="">-- Qualsiasi --</option>
                                <option value="benzina">Benzina</option>
                                <option value="diesel">Diesel</option>
                                <option value="hybrid">Hybrid</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="colore">Colore</label>
                            <input type="text" id="colore" name="colore" placeholder="es. Rosso, Nero, Blu...">
                        </div>
                    </div>
                    <div class="button-group">
                        <button type="submit" class="btn-submit"> Cerca</button>
                        <button type="reset" class="btn-reset">Cancella</button>
                    </div>
                </form>
            </div>

            <div class="loading" id="loading">Caricamento risultati...</div>
            <div class="error" id="error"></div>

            <div class="results-section" id="resultsSection">
                <h2>Risultati della ricerca</h2>
                <div class="results-count" id="resultsCount"></div>
                <div class="table-wrapper">
                    <table id="resultsTable">
                        <thead>
                            <tr>
                                <th>Marca</th>
                                <th>Modello</th>
                                <th>Alimentazione</th>
                                <th>Colore</th>
                                <th>Immagine</th>
                            </tr>
                        </thead>
                        <tbody id="resultsBody">
                        </tbody>
                    </table>
                </div>
                <div class="no-results" id="noResults" style="display: none;">
                    Nessun veicolo corrisponde ai criteri di ricerca.
                </div>
            </div>
        </div>
    </div>

    <script>
        var form = document.getElementById('searchForm');
        var resultsSection = document.getElementById('resultsSection');
        var resultsBody = document.getElementById('resultsBody');
        var resultsCount = document.getElementById('resultsCount');
        var noResults = document.getElementById('noResults');
        var loading = document.getElementById('loading');
        var errorDiv = document.getElementById('error');

        form.addEventListener('submit', function(event) {
            event.preventDefault();
            cercaAuto();
        });

        function cercaAuto() {
            // Ottieni i valori della form
            var marca = document.getElementById('marca').value.trim();
            var modello = document.getElementById('modello').value.trim();
            var alimentazione = document.getElementById('alimentazione').value.trim();
            var colore = document.getElementById('colore').value.trim();

            // Mostra il caricamento e nascondi gli errori
            loading.classList.add('show');
            errorDiv.classList.remove('show');
            resultsSection.classList.remove('show');

            // Crea la richiesta AJAX
            var xhr = new XMLHttpRequest();
            
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    loading.classList.remove('show');
                    
                    if (xhr.status === 200) {
                        try {
                            var response = JSON.parse(xhr.responseText);
                            mostraRisultati(response.auto);
                        } catch (e) {
                            mostraErrore('Errore nella decodifica della risposta del server.');
                        }
                    } else {
                        mostraErrore('Errore nella comunicazione con il server (status: ' + xhr.status + ')');
                    }
                }
            };

            xhr.onerror = function() {
                loading.classList.remove('show');
                mostraErrore('Errore di connessione al server.');
            };

            // Prepara i dati da inviare
            var dati = 'marca=' + encodeURIComponent(marca) +
                       '&modello=' + encodeURIComponent(modello) +
                       '&alimentazione=' + encodeURIComponent(alimentazione) +
                       '&colore=' + encodeURIComponent(colore);

            // Apre la connessione e invia la richiesta
            xhr.open('POST', '/cerca_auto', true);
            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
            xhr.send(dati);
        }

        function mostraRisultati(auto) {
            resultsBody.innerHTML = '';

            if (auto.length === 0) {
                noResults.style.display = 'block';
                resultsCount.innerHTML = '';
            } else {
                noResults.style.display = 'none';
                resultsCount.innerHTML = 'Trovati <strong>' + auto.length + '</strong> veicolo/i';

                for (var i = 0; i < auto.length; i++) {
                    var row = document.createElement('tr');
                    row.innerHTML = '<td>' + capitalizza(auto[i].marca) + '</td>' +
                                   '<td>' + capitalizza(auto[i].modello) + '</td>' +
                                   '<td>' + capitalizza(auto[i].alimentazione) + '</td>' +
                                   '<td>' + capitalizza(auto[i].colore) + '</td>' +
                                   '<td><img src="' + auto[i].immagine + '" alt="' + auto[i].marca + ' ' + auto[i].modello + '" style="max-width: 100px; height: auto; border-radius: 5px;"></td>';
                    resultsBody.appendChild(row);
                }
            }

            resultsSection.classList.add('show');
        }

        function mostraErrore(messaggio) {
            errorDiv.textContent = messaggio;
            errorDiv.classList.add('show');
        }

        function capitalizza(testo) {
            return testo.charAt(0).toUpperCase() + testo.slice(1).toLowerCase();
        }
    </script>
</body>
</html>
